<div class="login-page"> <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Login TeachHub</mat-card-title>
      <mat-card-subtitle>Conectando professores ao redor do planeta.</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form (ngSubmit)="login()" #loginForm="ngForm" class="login-form">

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>E-mail</mat-label>
    <input matInput type="email" name="email" [(ngModel)]="loginData.email" (ngModelChange)="errorMessage = ''" required email placeholder="exemplo@email.com">
    <mat-icon matSuffix>email</mat-icon>
    <mat-error>Informe um e-mail válido</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Senha</mat-label>
    <input matInput type="password" name="senha" [(ngModel)]="loginData.senha" (ngModelChange)="errorMessage = ''" required placeholder="Sua senha">
    <mat-icon matSuffix>lock</mat-icon>
    <mat-error>Informe a senha</mat-error>
  </mat-form-field>

  <p class="error-text" *ngIf="errorMessage">
    <mat-icon>error_outline</mat-icon>
    {{ errorMessage }}
  </p>

  <button mat-flat-button color="primary" type="submit" [disabled]="loginForm.invalid || carregando" class="btn-login">
    {{ carregando ? 'Entrando...' : 'Entrar' }}
  </button>
</form>

      <div class="divider">
        <span>ou</span>
      </div>

      <div class="btn-google" #botaoGoogle></div>

      <div class="login-footer">
        <p>Não tem uma conta? <a routerLink="/register">Cadastre-se</a></p>
      </div>
    </mat-card-content>
  </mat-card>
</div>
