<div class="filter-header">
  <mat-chip-listbox aria-label="Filtros de postagem">
    <mat-chip-option selected color="primary">Recentes</mat-chip-option>
    <mat-chip-option>Trending</mat-chip-option>
    <mat-chip-option>Minhas Postagens</mat-chip-option>
  </mat-chip-listbox>

  <div class="search-control">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Buscar postagens</mat-label>
      <input
        matInput
        [(ngModel)]="termoBusca"
        placeholder="Título ou #tag"
        aria-label="Buscar por título ou tag"
        (keyup.enter)="pesquisar()"
      >
    </mat-form-field>
    <button mat-flat-button color="primary" (click)="pesquisar()" [disabled]="carregandoFeed">
      <mat-icon class="material-symbols-outlined">search</mat-icon>
      Buscar
    </button>
  </div>
</div>

<div class="feed-loading" *ngIf="carregandoFeed">
  <mat-spinner diameter="36"></mat-spinner>
</div>

<mat-card class="post-card" *ngFor="let post of postagensExibidas" [hidden]="carregandoFeed">
  <mat-card-header class="post-header-clickable">
    <img referrerpolicy="no-referrer"
      mat-card-avatar
      class="post-avatar"
      [src]="post.usuarioDTO?.imagemPerfil || 'default-avatar.svg'"
      [alt]="'Foto de ' + post.autor"
    >
    <a class="post-header-content" [routerLink]="['/perfil', post.usuarioDTO?.id]">
      <mat-card-title>{{ post.autor }}</mat-card-title>
      <mat-card-subtitle>{{
        post.dataCriacao | date: "dd/MM/yyyy"
      }}</mat-card-subtitle>
    </a>
  </mat-card-header>

  <mat-card-content class="post-content">
    <a class="post-content-clickable" [routerLink]="['/postagens', post.idPostagem]">
      <h3>{{ post.titulo }}</h3>
      <p>{{ post.descricao }}</p>
    </a>
  </mat-card-content>

  <mat-card-actions class="post-action">
    <button mat-button (click)="notaPostagem(post.idPostagem, 'like'); $event.stopPropagation()">
      <mat-icon class="material-symbols-outlined">thumb_up</mat-icon>
      <span>{{ post.likes }}</span>
    </button>

    <span class="space"></span>

    <button
      mat-icon-button
      class="star-button"
      [class.active]="post.isFavorita"
      (click)="favoritarPostagem(post.idPostagem);
      $event.stopPropagation()">
      
      <mat-icon class="material-symbols-outlined">
        {{ post.isFavorita ? "star" : "star_outline" }}
      </mat-icon>
    </button>
  </mat-card-actions>
</mat-card>

<p class="feed-empty" *ngIf="!carregandoFeed && postagensExibidas.length === 0">
  Nenhuma postagem encontrada.
</p>

<mat-paginator
  [length]="totalPostagens"
  [pageSize]="pageSize"
  [pageSizeOptions]="[5, 10, 25, 100]"
  [pageIndex]="pageIndex"
  [disabled]="carregandoFeed"
  (page)="mudancaPagina($event)"
></mat-paginator>
