<div class="create-post-container">
  <mat-card class="post-card">
    <header class="post-header">
      <h1>🚀 Nova Postagem</h1>
      <p>Crie seus posts educativos ou ajude a comunidade com um novo conhecimento!</p>
    </header>

    <div class="post-body">
      <mat-form-field appearance="fill" class="title-field-container">
        <mat-label>Título da postagem</mat-label>
        <input matInput [(ngModel)]="titulo" placeholder="Ex: Introdução à Algoritmos">
      </mat-form-field>
      <div #editor class="quill-editor"></div>

      <mat-form-field appearance="outline" class="tags-field">
        <mat-label>Tags</mat-label>
        <input
          matInput
          [(ngModel)]="tags"
          placeholder="#matematica basica #geometria #física"
          aria-describedby="tags-help"
          (ngModelChange)="erroTags = ''"
        >
        <mat-hint id="tags-help">Use # para separar de 1 a 10 tags.</mat-hint>
        <mat-error *ngIf="erroTags">{{ erroTags }}</mat-error>
      </mat-form-field>

      <p class="submit-error" *ngIf="erroEnvio" role="alert">{{ erroEnvio }}</p>

      <div class="post-settings">
        <mat-form-field appearance="outline">
          <mat-label>Categoria</mat-label>
          <mat-select [(ngModel)]="categoria">
            <mat-option value="matematica">Matemática</mat-option>
            <mat-option value="ciencias">Ciências</mat-option>
            <mat-option value="fisica">Física</mat-option>
            <mat-option value="quimica">Química</mat-option>
            <mat-option value="historia">História</mat-option>
          </mat-select>
        </mat-form-field>

        <fieldset class="tipo-postagem" aria-label="Tipo da postagem">
          <legend>Tipo</legend>
          <button type="button" role="radio" [attr.aria-checked]="conteudo" [class.selected]="conteudo"
            (click)="conteudo = true; tarefa = false">Conteúdo</button>
          <button type="button" role="radio" [attr.aria-checked]="tarefa" [class.selected]="tarefa"
            (click)="conteudo = false; tarefa = true">Tarefa</button>
        </fieldset>
      </div>
    </div>

    <footer class="post-footer">
      <button mat-button color="warn" (click)="voltar()">Descartar</button>
      <div class="main-actions">
        <button mat-stroked-button (click)="voltar()">Voltar</button>
        <button mat-flat-button color="primary" (click)="criarPostagem()" [disabled]="salvando">
          <mat-icon class="material-symbols-outlined">send</mat-icon>
          {{ salvando ? 'Criando...' : 'Criar Postagem' }}
        </button>
      </div>
    </footer>
  </mat-card>
</div>
